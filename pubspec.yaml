name: hipersign_mobile_app
description: Hipersign - role-based mobile app for ERPNext (calendar, follow-ups, meetings, customers, trials).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  provider: ^6.1.5
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  intl: ^0.20.2
  timezone: ^0.11.0
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  open_filex: ^4.7.0
  package_info_plus: ^10.2.2
  just_audio: '>=0.9.40 <0.11.0' # plays call recordings and WhatsApp voice messages
  record: '>=5.2.0 <8.0.0' # records WhatsApp voice messages
  image_picker: ^1.1.2 # photos for WhatsApp
  file_picker: '>=8.1.2 <11.0.0' # documents for WhatsApp

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# App icon. Regenerate after changing the image: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
