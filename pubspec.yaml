name: hipersign_mobile_app
description: Hipersign - role-based mobile app for ERPNext (calendar, follow-ups, meetings, customers, trials).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  provider: ^6.1.5
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  intl: ^0.20.2
  timezone: ^0.11.0
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
