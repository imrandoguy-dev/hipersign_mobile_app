name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK as a release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects and apply Hipersign settings
        run: |
          set +e
          bash tool/setup_platforms.sh > setup.txt 2>&1
          code=$?
          cat setup.txt
          # Surface the reason as annotations (readable from the run page / API).
          if [ $code -ne 0 ]; then tail -25 setup.txt | while IFS= read -r line; do echo "::error::$line"; done; fi
          exit $code
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          # Surface problems as annotations (readable from the run page / API).
          grep -E "^ *(error|warning) " analyze.txt | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          exit $code
      - name: Unit and widget tests
        run: flutter test
      - name: Unlock release signing key
        env:
          HM_SIGNING_PASSWORD: ${{ secrets.HM_SIGNING_PASSWORD }}
        run: |
          if [ -z "$HM_SIGNING_PASSWORD" ]; then
            echo "::warning::HM_SIGNING_PASSWORD secret is not set - building with a temporary debug key (in-app updates will not install over older builds)."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android-signing/hipersign-release.jks.enc -out "$RUNNER_TEMP/hipersign-release.jks" \
            -pass env:HM_SIGNING_PASSWORD
          echo "HM_KEYSTORE_PATH=$RUNNER_TEMP/hipersign-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_SIGNING_PASSWORD }}
        run: |
          # Every build gets a higher number, so phones know an update is newer.
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          flutter build apk --release --build-number "$BUILD" --build-name "0.1.$BUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: hipersign-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish installable APK (Releases -> "Latest pilot build")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Hipersign.apk
          MSG=$(git log -1 --pretty=%s | head -c 300 | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
          printf '{"version_code": %s, "version_name": "0.1.%s", "commit": "%s", "notes": %s, "mandatory": false}\n' \
            "$BUILD" "$BUILD" "${GITHUB_SHA::7}" "$MSG" > version.json
          cat version.json
          gh release delete pilot --yes --cleanup-tag || true
          cat > notes.md <<EOF
          ## Download Hipersign for Android (version 0.1.$BUILD)

          **On your Android phone, tap \`Hipersign.apk\` below** to download it, then open the downloaded file and tap **Install**.

          - First time only: Android asks to allow installing from your browser or Files app - tap **Settings > Allow from this source**, then go back and tap **Install**.
          - Already have Hipersign? You don't need this page - the app updates itself (More > Settings > Check for updates).
          - Sign in with your company's ERP address (e.g. \`https://yourcompany.hipersignerp.cloud\`) and your ERP username and password.

          Changes: $(git log -1 --pretty=%s | head -c 300)
          EOF
          gh release create pilot Hipersign.apk version.json --latest \
            --title "Hipersign for Android - 0.1.$BUILD" \
            --notes-file notes.md

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects and apply Hipersign settings
        run: |
          set +e
          bash tool/setup_platforms.sh > setup.txt 2>&1
          code=$?
          cat setup.txt
          # Surface the reason as annotations (readable from the run page / API).
          if [ $code -ne 0 ]; then tail -25 setup.txt | while IFS= read -r line; do echo "::error::$line"; done; fi
          exit $code
      - name: Build iOS (compile check, unsigned)
        run: |
          set +e
          flutter build ios --release --no-codesign > build.txt 2>&1
          code=$?
          tail -200 build.txt
          grep -E "Error: |error: " build.txt | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit $code
