name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK as a release

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects and apply Hipersign settings
        run: bash tool/setup_platforms.sh
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test
      - name: Build APK (pilot build, debug-signed)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hipersign-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish installable APK (Releases -> "Latest pilot build")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Hipersign.apk
          gh release delete pilot --yes --cleanup-tag || true
          gh release create pilot Hipersign.apk --prerelease \
            --title "Latest pilot build" \
            --notes "Built from ${GITHUB_SHA::7}. On an Android phone, tap Hipersign.apk to download and install."

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects and apply Hipersign settings
        run: bash tool/setup_platforms.sh
      - name: Build iOS (compile check, unsigned)
        run: flutter build ios --release --no-codesign
